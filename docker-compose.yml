services:
  token-ms-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: token_db
      POSTGRES_USER: token
      POSTGRES_PASSWORD: token
    ports:
      - "5436:5432"
    volumes:
      - token_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U token -d token_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  token-ms-cache:
    image: eqalpha/keydb:latest
    command: ["keydb-server", "--appendonly", "yes"]
    ports:
      - "6381:6379"
    volumes:
      - token_keydb:/data

  token-ms-api:
    build: .
    depends_on:
      token-ms-db:
        condition: service_healthy
      token-ms-cache:
        condition: service_started
    environment:
      DATABASE_URL: postgres://token:token@token-ms-db:5432/token_db
      CACHE_URL: redis://token-ms-cache:6379/0
      KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL:-http://keycloak:8080/}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-sme-apps}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-token-ms}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
      DEBUG: ${DEBUG:-False}
    ports:
      - "8003:8003"

networks:
  default:
    name: sme-identidade
    external: true

volumes:
  token_pg:
  token_keydb:
