[project]
name = "SME-Identidade-Token-Microsservico"
version = "0.0.1"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
authors = [{ name = "SME" }]

# ==== Coverage ====
[tool.coverage.run]
source = [
    "apps",
    "config"
]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/templates/*"
]

# ==== Ruff ====
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "D"]
ignore = ["D203", "D212", "D104", "D105", "D106", "D107"]

[tool.ruff.lint.per-file-ignores]
"**/tests.py" = ["D100"]
"**/tests/**/*.py" = ["D100", "D101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 120

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.12"
exclude = ".*/migrations/.*"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true